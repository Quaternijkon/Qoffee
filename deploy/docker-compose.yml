services:
  postgres:
    image: postgres:16-alpine
    container_name: qoffee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - qoffee-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile.runtime
    container_name: qoffee-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 8080
      JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      JWT_ISSUER: qoffee-api
      JWT_AUDIENCE: qoffee-android
      JWT_REALM: qoffee
    ports:
      - "127.0.0.1:18080:8080"

volumes:
  qoffee-postgres-data:
